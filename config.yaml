# =========================================================================
#  CONFIGURACIÓN DEL ANÁLISIS DE RENTABILIDAD DE PISOS
# =========================================================================
#  Edita este archivo y ejecuta:
#     python run.py --pisos pisos.csv     (analiza un fichero de anuncios)
#     python run.py --web                 (interfaz web local)
# =========================================================================

# Nombre base de los ficheros de salida: <archivo_salida>_pisos.csv/.html/.md
archivo_salida: resultados

# --- Supuestos económicos del cálculo ---------------------------------
gastos_pct: 0.25          # % del alquiler que se va en gastos (IBI, comunidad, seguro, mantenimiento, gestión, vacancia)
costes_compra_pct: 0.11   # % sobre el precio por impuestos y gastos de compra (ITP/IVA, notaría, registro, agencia)

# --- Hipoteca (análisis con apalancamiento) ---------------------------
# Si compras al contado, pon financiacion_pct: 0 y el panel omitirá las columnas
# de cuota/cash-flow/rentabilidad sobre fondos propios.
financiacion_pct: 0.70    # % del precio que financias con hipoteca (0.70 = 70 %)
interes_hipoteca: 0.03    # interés nominal anual (0.03 = 3 %)
anios_hipoteca: 25        # plazo de la hipoteca en años

# --- Detección de "chollos" -------------------------------------------
# Un piso se marca 🔥 si su €/m² está este % (o más) por debajo de la MEDIANA de
# €/m² de su zona (calculada con los pisos del propio fichero; hacen falta al menos
# 2 pisos en la zona para comparar).
umbral_chollo: 10         # % por debajo de la mediana de la zona

# --- Proyección a futuro (opcional) -----------------------------------
# Con revalorizacion_anual > 0 se calcula la ganancia por revalorización y el ROI
# proyectado a 'horizonte_anios'.
revalorizacion_anual: 0.02   # revalorización anual estimada del precio (0.02 = 2 %). 0 = desactivado
horizonte_anios: 10          # años de la proyección

# --- Escenario de estrés (opcional) -----------------------------------
# Con estres_alquiler_pct > 0 se calcula una rentabilidad neta "pesimista"
# suponiendo el alquiler ese % más bajo.
estres_alquiler_pct: 0.10    # 0.10 = alquiler un 10 % más bajo. 0 = desactivado

# --- Rentabilidad objetivo (opcional) ---------------------------------
# Con un valor > 0 se calcula, para cada piso, el "precio objetivo": a qué precio
# deberías comprarlo para lograr esa rentabilidad neta. Útil para negociar.
rentabilidad_objetivo: 7     # % de rentabilidad neta que persigues. 0 = desactivado

# --- IRPF (opcional) --------------------------------------------------
# Con tipo_irpf > 0 se calcula la rentabilidad neta DESPUÉS de impuestos: descuenta
# los intereses de la hipoteca (deducibles), aplica la reducción por alquiler de
# vivienda habitual y tu tipo marginal. Es una aproximación.
tipo_irpf: 0.30              # tu tipo marginal de IRPF (0.30 = 30 %). 0 = desactivado
reduccion_irpf: 0.60         # reducción del rendimiento neto (0.60 = 60 %, vivienda habitual)

# --- Estimación del alquiler ------------------------------------------
# €/m²/mes de referencia por zona, para estimar el alquiler cuando el anuncio de
# venta no lo trae. Tus valores mandan sobre la tabla integrada.
rentas_zona:
  Barcelona: 14
  "Madrid centro": 18
  Madrid: 15
  Valencia: 11
  Sevilla: 10

# Usar la tabla de rentas de referencia integrada (€/m²·mes orientativos por provincia)
# para las zonas que no estén en 'rentas_zona'. Reemplázala/afínala con datos de SERPAVI.
usar_rentas_referencia: true

# --- IA opcional (API de Claude) --------------------------------------
# Para los pisos SIN alquiler indicado, pide a Claude que lo estime y detecte riesgos.
# Requiere:  pip install -r requirements-ia.txt   y   export ANTHROPIC_API_KEY=...
# Si no está disponible, NO falla: se usa la estimación por zona. También: opción --ia.
usar_ia: false
modelo_ia: claude-opus-4-8
